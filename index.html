<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#e8420a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRONPULSE" />
    <meta name="application-name" content="IRONPULSE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="google" content="notranslate" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="msapplication-TileColor" content="#e8420a" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <!-- Fallback SEO title & desc (overridden by react-helmet-async on SPA routes) -->
    <title>IRONPULSE — Modern Gym Management Platform</title>
    <meta name="description" content="IRONPULSE is a modern gym management platform — member management, trainer tools, QR attendance, payments, diet & workout plans, and analytics for fitness businesses." />
    <link rel="canonical" href="https://ironpulse.app/" />

    <!-- Open Graph (fallback) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IRONPULSE — Gym Management Platform" />
    <meta property="og:description" content="Run your fitness business smarter. Member management, attendance, trainer tools, payments, diet & workout plans — all in one platform." />
    <meta property="og:url" content="https://ironpulse.app/" />
    <meta property="og:site_name" content="IRONPULSE" />
    <meta property="og:image" content="https://ironpulse.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card (fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ironpulse" />
    <meta name="twitter:title" content="IRONPULSE — Gym Management Platform" />
    <meta name="twitter:description" content="Run your fitness business smarter with IRONPULSE." />
    <meta name="twitter:image" content="https://ironpulse.app/icons/icon-512.png" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
